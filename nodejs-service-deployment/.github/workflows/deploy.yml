name: Deploy Node.js service

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: node-service-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${EC2_SSH_PORT:-22}" -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Create temporary Ansible inventory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          printf '%s\n' \
            '[node_service]' \
            "${EC2_HOST} ansible_user=${EC2_USER} ansible_ssh_private_key_file=${HOME}/.ssh/deploy_key" \
            > nodejs-service-deployment/ansible/inventory.ci.ini

      - name: Deploy using Ansible
        run: |
          ansible-playbook \
            -i nodejs-service-deployment/ansible/inventory.ci.ini \
           nodejs-service-deployment/ansible/node_service.yml \
            --tags app

      - name: Verify HTTP endpoint
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          curl --fail --retry 10 --retry-delay 3 "http://${EC2_HOST}/"
